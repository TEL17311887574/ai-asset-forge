# 服务配置。修改后重启服务即可生效。
# 说明：本文件只放「可调参数」，敏感的 API Key / Base URL 不在此处，
#       它们由登录页面提交并加密保存在浏览器 Cookie 中。

[server]
host = "0.0.0.0"
port = 3000
request_timeout = 180.0        # 单次调用 OpenAI 的超时时间（秒）
reload = true                  # 开发模式自动重载

[models]
default = "gpt-image-2"        # 默认模型
available = ["gpt-image-2", "gpt-image-2.5"]   # 前端模型切换器可选列表

[limits]
max_prompt_length = 4000       # 提示词最大字符数
max_source_files = 16          # 最多上传参考图数量
max_file_bytes = 20971520      # 单文件大小上限（20 MB）

[session]
max_age = 2592000              # 会话有效期（秒）= 30 天
cookie_name = "inx_session"