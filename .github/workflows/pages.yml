name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # 一期：纯静态站点在 docs/ 目录下发布。
          # 二期（删除 Python 后端后）：静态文件移到仓库根目录，这里改成 `.`。
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
